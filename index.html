<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="dashboard">
<header class="hero card">
  <div><p class="eyebrow">MY DAILY SPACE</p><h1 id="greeting">Good Morning</h1><p id="date"></p></div>
  <div class="clock-row"><span id="clock">00:00:00</span><button id="themeToggle" class="icon-btn" type="button">☾</button></div>
</header>

<section class="grid">
<article class="card timer-card">
  <div class="heading"><div><p class="eyebrow">FOCUS</p><h2>Pomodoro Timer</h2></div><span class="pill">25 MIN</span></div>
  <div id="timer" class="timer">25:00</div>
  <div class="actions"><button id="startTimer" class="primary">Start</button><button id="stopTimer" class="secondary">Stop</button><button id="resetTimer" class="secondary">Reset</button></div>
  <p id="timerStatus" class="helper">Ready when you are.</p>
</article>

<article class="card tasks-card">
  <div class="heading"><div><p class="eyebrow">TODAY</p><h2>Tasks</h2></div><span id="taskCount" class="pill">0 tasks</span></div>
  <form id="taskForm" class="input-row"><input id="taskInput" maxlength="100" placeholder="Add a new task..." required><button class="primary">Add</button></form>
  <p id="taskMessage" class="helper"></p><ul id="taskList"></ul>
</article>

<article class="card links-card">
  <div class="heading"><div><p class="eyebrow">SHORTCUTS</p><h2>Quick Links</h2></div></div>
  <form id="linkForm" class="link-form"><input id="linkName" maxlength="30" placeholder="Link name" required><input id="linkUrl" type="url" placeholder="https://example.com" required><button class="primary">Add Link</button></form>
  <div id="linkList" class="link-list"></div>
</article>
</section>
<footer></footer>
</main>
<script src="js/script.js"></script>
</body>
</html>
